[project]
name = "auth"
version = "0.1.0"
description = ""
authors = [
    {name = "Irimaso Maurice",email = "irimasomaurice@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt (>=5.0.0,<6.0.0)"
]

[tool.poetry]
packages = [{include = "auth", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.16.0,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]
